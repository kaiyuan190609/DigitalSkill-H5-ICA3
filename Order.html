        <form class="OrderForm" action="TYorder.html" method="get">
            <label for="ordname" class="input">Your Name:<span class="required">*</span></label>
            <input type="text" name="ordname" id="ordname" size="30" placeholder="E.g Abel Ang" required class="input">
            <br>

            <label for="Ordmail" class="input">Your Email:<span class="required">*</span></label>
            <input type="email" name="Ordmail" id="Ordmail" size="30" placeholder="E.g email@adress.com" required class="input">
            <br>

            <label for="ordname" class="input">Your Contact No.:</label>
            <input type="text" name="ordno." id="ordno." size="30" placeholder="eg. 12345678" class="input">
            <br>

            <input type="checkbox" name="ACfilt" id="ACfilt" checked class="Ordfilter"> 
            <label class="Ordfilter" for="ACfilt">Arts &#38 craft</label>

            <input type="checkbox" name="Calfilt" id="Calfilt" checked class="Ordfilter"> 
            <label class="Ordfilter" for="Calfilt">Calculators</label>
            
            <input type="checkbox" name="WIfilt" id="WIfilt" checked class="Ordfilter"> 
            <label class="Ordfilter" for="WIfilt">Writing Material</label>

            <input type="checkbox" name="TAfilt" id="TAfilt" checked class="Ordfilter"> 
            <label class="Ordfilter" for="TAfilt">technological Accessories</label>
            <br>

            <div class="artcraft orderproduct">
                <p>Arts &#38 Crafts</p>
                <label for="CallSet">• Beginners Chinese Calligraphy Pen set (ink included)</label>
                <input type="number" name="CallSet" id="CallSet" class="numberboxstyle" min="0" max="50" value="0">
                <br>

                <label for="Bdaycard">• Birthday Cards</label>
                <input type="number" name="Bdaycard" id="Bdaycard" class="numberboxstyle" min="0" max="50" value="0">
                <br>

                <label for="OilPast">• Oil Pastel 12 Colours</label>
                <input type="number" name="OilPast" id="OilPast" class="numberboxstyle" min="0" max="50" value="0">
                <br>

                <label for="PaintBrush">• Paint Brush Set(6 pcs)</label>
                <input type="number" name="PaintBrush" id="PaintBrush" class="numberboxstyle" min="0" max="50" value="0">
                <br>

                <label for="scissors">• Scissors</label>
                <input type="number" name="scissors" id="scissors" class="numberboxstyle" min="0" max="50" value="0">
                <br>
            </div>

            <div class="Calcu orderproduct">
                <p>Calculators</p>
                <label for="Finacalc">• Financial Calculator</label>   
                <input type="number" name="Finacalc" id="Finacalc" class="numberboxstyle" min="0" max="50" value="0">             
            <br>
            <label for="Graphcalc">• Graph Calculator</label>   
                <input type="number" name="Graphcalc" id="Graphcalc" class="numberboxstyle" min="0" max="50" value="0">             
            <br>
            <label for="Scicalc">• Scientific Calculator</label>   
                <input type="number" name="Scicalc" id="Scicalc" class="numberboxstyle" min="0" max="50" value="0">             
            <br>
            </div>

            <div class="Writeins orderproduct">
                <p>Writing Instruments</p>
            <br>
            <label for="2BPack">• 2B Standard Pack</label>   
                <input type="number" name="2BPack" id="2BPack" class="numberboxstyle" min="0" max="50" value="0">

            <label for="BBP">• Blue Ballpoint Pen</label>   
                <input type="number" name="BBP" id="BBP" class="numberboxstyle" min="0" max="50" value="0">             
            <br>
            <label for="MP">• Mechanical Pencil</label>   
                <input type="number" name="MP" id="RBP" class="numberboxstyle" min="0" max="50" value="0">             
            <br>
            <label for="RBP">• Red Ballpoint Pen</label>   
                <input type="number" name="RBP" id="RBP" class="numberboxstyle" min="0" max="50" value="0">             
            <br>

            <br>
            <label for="LS">• Laptop Sleeves (Up to 16")</label>   
                <input type="number" name="LS" id="LS" class="numberboxstyle" min="0" max="50" value="0">             
            <br>
            <label for="PB">• Power Bank(5V/2A)</label>   
                <input type="number" name="PB" id="PB" class="numberboxstyle" min="0" max="50" value="0">             
            <br>
            <label for="USB">• USB Flash Drive(64GB)</label>   
                <input type="number" name="USB" id="USB" class="numberboxstyle" min="0" max="50" value="0">             
            <br>
            </div>
